name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest --cov
      - name: Docker image
        run: docker build -t groundlink:ci .

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Landing page
        run: pytest -m site -o addopts= -q
